name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - resume.json
      - README.md
      - theme/**
      - static/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Spellcheck content
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          files: resume.json README.md PIPELINE.md theme static scripts

      - name: Warn if the hand-maintained CV PDF has drifted from resume.json
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          current=$(node -pe "JSON.parse(require('fs').readFileSync('resume.json','utf8')).work.find(w=>!w.endDate)?.name ?? ''")
          if ! pdftotext static/cv.pdf - | grep -qiF "$(echo "$current" | cut -d'(' -f1 | xargs)"; then
            echo "::warning file=static/cv.pdf::CV PDF does not mention the current employer ($current) — the hand-maintained PDF has drifted from resume.json"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate resume.json against the JSON Resume schema
        run: npm run validate

      - name: Render site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # .well-known/security.txt is excluded by default otherwise
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
